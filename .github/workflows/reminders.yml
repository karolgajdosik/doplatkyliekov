name: Pripomienky užívania liekov (ručná záloha)

# Pripomienky posiela Worker workers/pripomienky každú minútu (plánovač Cloudflare).
# Tento workflow je len ručná záloha, ak by Worker nebežal; plánované spúšťanie na GitHube meškalo až 2 hodiny.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            data/full.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pywebpush==2.5.0
      - name: Odoslať pripomienky
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/reminders.py
