name: Dočasná diagnostika
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for h in https://be1a6e6d.doplatkyliekov.pages.dev https://doplatkyliekov.pages.dev https://doplatkyliekov.sk; do
            curl -sS -o /dev/null -w "R $h %{http_code} %{redirect_url}\n" "$h/liek/granal-2958e/?x=$RANDOM"
            curl -sS -o /dev/null -w "R $h noslash %{http_code} %{redirect_url}\n" "$h/liek/granal-2958e"
          done
          curl -sSI "https://doplatkyliekov.sk/liek/granal-2958e/" | grep -iE "^HTTP|cf-cache|age:|cache-control"
