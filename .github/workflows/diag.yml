name: Dočasná diagnostika asistenta
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - run: |
          (timeout 70 npx -y wrangler@4 pages deployment tail --project-name doplatkyliekov --environment production --format json > tail.txt 2> tail.err &)
          sleep 30
          for i in 1 2 3; do curl -sS -o /dev/null -w "POST %{http_code}\n" -H 'content-type: application/json' -d '{"q":"ahoj, aký je doplatok za concor 10"}' https://doplatkyliekov.sk/api/asistent; sleep 3; done
          sleep 35
          echo ---ERR; tail -c 1500 tail.err; echo ---TAIL
          python3 - <<'P'
          import json
          for line in open('tail.txt'):
              pass
          t=open('tail.txt').read()
          print(t[:6000])
          P
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/models/search?per_page=1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 400; echo
