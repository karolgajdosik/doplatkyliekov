name: Dočasná diagnostika asistenta
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in /api/obvod?q=Malacky /api/asistent /api/ceny /api/subscribe; do curl -sS -o b.txt -w "$u GET %{http_code}\n" "https://doplatkyliekov.sk$u"; head -c 200 b.txt; echo; done
          curl -sS -o b.txt -w "asistent bez q POST %{http_code}\n" -H 'content-type: application/json' -d '{}' https://doplatkyliekov.sk/api/asistent; head -c 300 b.txt; echo
          curl -sS -o b.txt -w "asistent POST %{http_code}\n" -H 'content-type: application/json' -d '{"q":"ahoj"}' https://doplatkyliekov.sk/api/asistent; head -c 300 b.txt; echo
          curl -sS -D - -o b.txt -H 'content-type: application/json' -d '{"q":"ahoj"}' https://doplatkyliekov.sk/api/asistent | head -20
