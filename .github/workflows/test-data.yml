name: Dočasný prieskum dát
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Lekarne
        run: |
          curl -sL "https://www.sukl.sk/pre-odbornikov-a-firmy/lekarne-a-vydajne-zdravotnickych-pomocok" -o l.html
          echo "::notice title=LEK links::$(grep -oiE 'href="[^"]+"' l.html | grep -viE 'facebook|twitter|#|javascript' | sort -u | grep -iE 'lekar|xls|csv|zoznam|pdf|verejne' | head -30 | tr '\n' ' ' | head -c 3500)"
          echo "::notice title=LEK text::$(sed 's/<[^>]*>/ /g' l.html | tr -s ' \n' ' ' | grep -oiE '.{0,200}(zoznam|register)[^.]{0,200}' | head -5 | tr '\n' '|' | head -c 3000)"
      - name: PIL zip
        run: |
          df -h . | tail -1
          curl -sL https://www.sukl.sk/verejne/Zoznam_SPC_PIL/spc_pil_aktualny.zip -o p.zip
          ls -la p.zip
          unzip -l p.zip > list.txt; wc -l list.txt
          echo "::notice title=COUNT::$(wc -l < list.txt)"
          echo "::notice title=HEAD::$(head -30 list.txt | tr -s ' ' | tr '\n' '|' | head -c 3000)"
          echo "::notice title=CONCOR::$(grep -iE 'concor|bisopro' list.txt | head -10 | tr -s ' ' | tr '\n' '|')"
          echo "::notice title=EXT::$(awk '{print $4}' list.txt | grep -oE '\.[A-Za-z]+$' | sort | uniq -c | sort -rn | head -8 | tr '\n' '|')"
          echo "::notice title=DIRS::$(awk '{print $4}' list.txt | awk -F/ 'NF>1{print $1}' | sort | uniq -c | sort -rn | head -8 | tr '\n' '|')"
