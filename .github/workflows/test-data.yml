name: Dočasný prieskum dát
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stĺpce zoznamu liekov
        run: |
          pip -q install openpyxl >/dev/null 2>&1
          curl -sL https://www.sukl.sk/verejne/Zoznam_liekov/zoznam_liekov_aktualny.zip -o f.zip && unzip -q f.zip zoznam_liekov.xlsx
          python3 - > out.txt 2>/dev/null <<'PY'
          import openpyxl, json
          wb = openpyxl.load_workbook('zoznam_liekov.xlsx', read_only=True)
          ws = wb.worksheets[0]
          rows = ws.iter_rows(values_only=True)
          head = next(rows)
          print(json.dumps(list(head), ensure_ascii=False, default=str))
          for r in rows:
              if r[1] in ('94163', '8157A'):
                  print(json.dumps([(h, v) for h, v in zip(head, r)][18:], ensure_ascii=False, default=str))
          PY
          i=0; while IFS= read -r line; do i=$((i+1)); echo "::notice title=X$i::$(echo "$line" | head -c 3900)"; done < out.txt
      - name: Lekárne z OpenStreetMap
        run: |
          Q='[out:json][timeout:120];area["ISO3166-1"="SK"][admin_level=2]->.a;(node["amenity"="pharmacy"](area.a);way["amenity"="pharmacy"](area.a););out center tags;'
          curl -s -m 180 --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -o osm.json
          python3 - <<'PY'
          import json
          d = json.load(open('osm.json'))
          out = []
          for e in d['elements']:
              t = e.get('tags', {}); lat = e.get('lat') or e.get('center', {}).get('lat'); lon = e.get('lon') or e.get('center', {}).get('lon')
              if not lat: continue
              addr = ' '.join(x for x in [t.get('addr:street') or t.get('addr:place', ''), t.get('addr:housenumber') or t.get('addr:conscriptionnumber', '')] if x).strip()
              city = t.get('addr:city', '')
              out.append([round(lat, 5), round(lon, 5), t.get('name') or 'Lekáreň', addr, city, t.get('opening_hours', ''), t.get('phone') or t.get('contact:phone', ''), t.get('dispensing', '')])
          out.sort()
          json.dump({'zdroj': '© prispievatelia OpenStreetMap (ODbL)', 'lekarne': out}, open('data/lekarne.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          print('::notice title=OSM::', len(out), 'lekarni; s adresou', sum(1 for x in out if x[3]), '; s hodinami', sum(1 for x in out if x[5]), out[:3])
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add data/lekarne.json && git commit -m "Lekárne z OpenStreetMap" && git push
