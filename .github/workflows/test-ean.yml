name: Dočasný prieskum EAN
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Obsah
        run: |
          pip -q install xlrd >/dev/null 2>&1
          curl -sL https://www.sukl.sk/verejne/Zoznam_liekov/zoznam_liekov_aktualny.zip -o f.zip
          echo "::notice title=FILES::$(unzip -l f.zip | tail -n +4 | head -20 | tr -s ' ' | tr '\n' '|')"
          mkdir z && unzip -q f.zip -d z
          cat > h.py <<'PY'
          import sys, xlrd, glob, json
          out = []
          for f in sorted(glob.glob('z/**/*.xls', recursive=True)):
              wb = xlrd.open_workbook(f)
              ws = wb.sheet_by_index(0)
              head = ws.row_values(0)
              row = ws.row_values(1) if ws.nrows > 1 else []
              out.append(f"{f} ({ws.nrows} r): " + json.dumps(list(zip(head, row))[:45], ensure_ascii=False))
          print("\n".join(out))
          PY
          python3 h.py > out.txt 2>&1
          i=0; while IFS= read -r line; do i=$((i+1)); echo "::notice title=X$i::$(echo "$line" | head -c 3800)"; done < out.txt
