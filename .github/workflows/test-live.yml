name: Dočasný test naostro
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: |
          B=https://doplatkyliekov.sk
          echo "::notice title=URL::$(for u in /sync.js /qr.js /manifest.webmanifest /vyhody-poistovni/ /zdielane/; do echo -n "$u $(curl -s -o /dev/null -w '%{http_code}' $B$u) "; done)"
          echo "::notice title=LETAK::$(curl -s -m 95 "$B/api/letak?kod=94163" | head -c 2500)"
          echo "::notice title=LEK::$(curl -s -o /dev/null -w '%{http_code}' $B/lekarne/) $(curl -s $B/lekarne.json | head -c 300)"
