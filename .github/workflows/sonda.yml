name: Dočasná sonda zdrojov
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for d in zkzp zkdp; do
            for m in 202611 202612; do
              h=$(curl -sL "https://www.health.gov.sk/Zdroje?/Sources/kategorizacia/$d/$m/" | grep -oiE "[A-Za-z0-9_.%-]+\.(xlsx|xls|docx|pdf|zip)" | sort -u | head -12 | tr '\n' ' ')
              echo "::notice title=$d $m::$h"
            done
          done
          x=$(curl -sL "https://www.sukl.sk/pre-odbornikov-a-firmy/dostupnost-a-kvalita-liekov/kvalita-liekov/oznamy-o-stiahnuti-liekov" | grep -oiE "stiahnutie-[a-z0-9-]+" | sort -u | wc -l)
          echo "::notice title=sukl stiahnutia::pocet oznamov na stranke $x"
