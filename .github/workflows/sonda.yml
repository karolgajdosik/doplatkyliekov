name: Dočasná sonda zdrojov
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for d in zkzp zkszm zkdp zkl; do
            u="https://www.health.gov.sk/Zdroje?/Sources/kategorizacia/$d/"
            n=$(curl -sL "$u" | grep -oiE 'href="[^"]*"' | grep -c . || true)
            last=$(curl -sL "$u" | grep -oiE 'href="[^"]*/[0-9]{6}/?"' | sort | tail -1)
            echo "::notice title=$d::odkazov $n, posledny $last"
          done
          f=$(curl -sL "https://www.health.gov.sk/Zdroje?/Sources/kategorizacia/zkzp/" | grep -oiE 'href="[^"]*/[0-9]{6}/?"' | sort | tail -1 | sed 's/href="//;s/"$//')
          [ -n "$f" ] && echo "::notice title=zkzp-obsah::$(curl -sL "https://www.health.gov.sk$f" | grep -oiE 'href="[^"]*\.(xlsx?|zip|pdf|csv)"' | head -8 | tr '\n' ' ')"
          u="https://www.sukl.sk/hlavna-stranka/slovenska-verzia/bezpecnost-liekov/stiahnutie-liekov-z-trhu"
          echo "::notice title=sukl-stiahnutie::$(curl -sL -o /dev/null -w '%{http_code}' "$u")"
          echo "::notice title=sukl-hladaj::$(curl -sL https://www.sukl.sk/ | grep -oiE 'href="[^"]*(stiahn|rapid|kvalit|oznam)[^"]*"' | sort -u | head -8 | tr '\n' ' ')"
