name: tmp pushtest
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          set +e
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 > /tmp/npm.log 2>&1; echo "::notice::npm $? $(tail -c 300 /tmp/npm.log | tr '\n' ' ')"
          npx playwright install --with-deps firefox > /tmp/pw.log 2>&1; echo "::notice::pw $? $(tail -c 300 /tmp/pw.log | tr '\n' ' ')"
      - run: NODE_PATH=/tmp/pw/node_modules xvfb-run -a node tools/pushtest/test.mjs
