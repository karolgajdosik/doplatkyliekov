name: Aktualizácia zoznamu liekov

on:
  schedule:
    # každý deň o 6:17 UTC: nový zoznam ministerstva (vychádza koncom mesiaca) a výpadky ŠÚKL
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5 pywebpush==2.5.0

      - name: Stiahnuť a spracovať zoznam
        id: data
        run: |
          set -o pipefail
          python scripts/build_data.py 2>&1 | tee build.log || {
            echo "::error title=build_data::$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }

      - name: Overiť generovanie podstránok
        run: python scripts/build_pages.py

      - name: Uložiť zmeny
        run: |
          git add -A data site/data.json site/sitemap.xml
          if git diff --cached --quiet; then
            echo "Žiadne zmeny v dátach."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualizácia dát o liekoch"
          git push

      - name: Rozoslať e-mailové upozornenia
        # beží aj keď sťahovanie zlyhá – použijú sa posledné uložené dáta
        if: ${{ !cancelled() }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -o pipefail
          python scripts/notify.py 2>&1 | tee notify.log || {
            echo "::error title=notify::$(tail -n 25 notify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          echo "::notice title=notify::$(grep -E '^(Odoslané|Notifikácie|E-maily|Upozornenia)' notify.log | tr '\n' ' ')"
