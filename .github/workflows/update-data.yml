name: Aktualizácia zoznamu liekov

on:
  schedule:
    # každý deň o 6:17 UTC: nový zoznam ministerstva (vychádza koncom mesiaca) a výpadky ŠÚKL
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Stiahnuť a spracovať zoznam
        run: python scripts/build_data.py

      - name: Overiť generovanie podstránok
        run: python scripts/build_pages.py

      - name: Uložiť zmeny
        run: |
          git add -A data site/data.json site/sitemap.xml
          if git diff --cached --quiet; then
            echo "Žiadne zmeny v dátach."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualizácia dát o liekoch"
          git push
