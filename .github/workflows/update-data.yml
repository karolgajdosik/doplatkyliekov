name: Aktualizácia zoznamu liekov

on:
  schedule:
    # každý deň o 6:17 UTC počas posledného týždňa a prvých dní mesiaca,
    # keď ministerstvo zverejňuje nový zoznam
    - cron: "17 6 1-5,24-31 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Stiahnuť a spracovať zoznam
        run: python scripts/build_data.py

      - name: Uložiť zmeny
        run: |
          if git diff --quiet -- site/data.json; then
            echo "Žiadne zmeny v dátach."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "Aktualizácia zoznamu liekov"
          git push
