name: tmp cfcheck
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.CF_ACCOUNT_ID }}
          T: ${{ secrets.CF_API_TOKEN }}
          V: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set +e
          h="Authorization: Bearer $T"
          echo "::notice::verify $(curl -s -H "$h" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 300)"
          echo "::notice::scripts $(curl -s -H "$h" https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts | jq -c "{s:.success,e:.errors,n:[.result[]?.id]}" | head -c 400)"
          echo "::notice::subdomain $(curl -s -H "$h" https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain | head -c 300)"
          echo "::notice::pages $(curl -s -H "$h" https://api.cloudflare.com/client/v4/accounts/$A/pages/projects | head -c 300)"
          echo "::notice::vapidfmt len=${#V} pem=$(echo "$V" | grep -c BEGIN)"
