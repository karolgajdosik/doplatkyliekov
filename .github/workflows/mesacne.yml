name: Mesačné dáta (letáky, lekárne)

on:
  schedule:
    - cron: "23 4 3 * *"
  workflow_dispatch:
    inputs:
      bez_letakov:
        description: "Preskočiť príbalové letáky (len lekárne)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mesacne
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 striprtf==0.0.29
      - name: Kúpele a indikácie (MZ SR)
        continue-on-error: true
        run: python scripts/build_kupele.py
      - name: Register liekov ŠÚKL (výdaj, nehradené lieky)
        continue-on-error: true
        run: |
          set +e
          python scripts/build_register.py 2>&1 | tee reg.log; code=${PIPESTATUS[0]}
          echo "::notice title=register::$(tail -n 3 reg.log | tr '\n' ' ' | head -c 900)"
          exit $code
      - name: Lekárne z OpenStreetMap
        continue-on-error: true
        run: |
          set +e
          python scripts/build_lekarne.py 2>&1 | tee lek.log; code=${PIPESTATUS[0]}
          echo "::notice title=lekarne::$(tail -n 4 lek.log | tr '\n' ' ' | head -c 900)"
          exit $code
      - name: Pobočky zdravotných poisťovní
        continue-on-error: true
        run: |
          set +e
          python scripts/build_pobocky.py 2>&1 | tee pob.log; code=${PIPESTATUS[0]}
          echo "::notice title=pobocky::$(tail -n 4 pob.log | tr '\n' ' ' | head -c 900)"
          exit $code
      - name: Príbalové letáky zo ŠÚKL
        if: ${{ !inputs.bez_letakov }}
        continue-on-error: true
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq catdoc poppler-utils >/dev/null
          set +e
          curl -sSL --retry 3 --retry-delay 30 -o /tmp/pil.zip https://www.sukl.sk/verejne/Zoznam_SPC_PIL/spc_pil_aktualny.zip
          ls -la /tmp/pil.zip
          python scripts/build_pil.py /tmp/pil.zip 2>&1 | tee pil.log; code=${PIPESTATUS[0]}
          echo "::notice title=pil::$(tail -n 3 pil.log | tr '\n' ' ' | head -c 900)"
          [ $code -eq 0 ]
          rm -f /tmp/pil.zip
      - name: Uložiť zmeny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          for f in data/lekarne.json data/vydajne.json data/pobocky.json data/pil data/pil_map.json data/register.json data/kupele.json; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Bez zmien."; else git commit -m "Mesačné dáta: letáky, lekárne, výdajne a pobočky" && git pull --rebase -q && git push; fi
