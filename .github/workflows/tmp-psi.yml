name: tmp psi
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          set +e
          npm i -g lighthouse@13.5.0 >/dev/null 2>&1
          for i in 1 2 3 4 5; do lighthouse https://doplatkyliekov.sk/ --only-categories=performance --output=json --output-path=r$i.json --chrome-flags="--headless=new" --quiet; done
          python3 - <<'PY'
          import json
          for i in (1,2,3,4,5):
              L=json.load(open(f'r{i}.json')); a=L['audits']
              m=' | '.join(f"{k.split('-')[0]}={a[k].get('displayValue')}" for k in ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift'])
              print(f"::notice title=beh {i}::{L['categories']['performance']['score']} {m}")
          a=json.load(open('r2.json'))['audits']
          def show(k,n=1500):
              x=a.get(k)
              if x: print(f"::notice title={k}::{x.get('displayValue')} {json.dumps(x.get('details'))[:n]}")
          show('lcp-breakdown-insight',900); show('network-dependency-tree-insight',3500); show('render-blocking-insight',500); show('font-display-insight',500)
          reqs=a['network-requests']['details']['items']
          print("::notice title=requests::"+' ; '.join(f"{r['url'][-45:]} {r.get('resourceType')} s={round(r.get('networkRequestTime',0))} e={round(r.get('networkEndTime',0))} {r.get('transferSize')}B {r.get('priority')}" for r in reqs)[:3500])
          PY
