name: tmp wtest
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - env:
          A: ${{ secrets.CF_ACCOUNT_ID }}
          T: ${{ secrets.CF_API_TOKEN }}
          NS: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set +e
          kv="https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces/$NS/values"
          H="Authorization: Bearer $T"
          id=00000000000000000000000000test01
          P=$(python3 -c "import base64;from cryptography.hazmat.primitives.asymmetric import ec;from cryptography.hazmat.primitives import serialization as s;k=ec.generate_private_key(ec.SECP256R1());print(base64.urlsafe_b64encode(k.public_key().public_bytes(s.Encoding.X962,s.PublicFormat.UncompressedPoint)).decode().rstrip('='))")
          t=$(TZ=Europe/Bratislava date -d '+2 min' +%H:%M)
          idx=$(curl -s -H "$H" "$kv/doses:index"); echo "$idx" | jq -e . >/dev/null 2>&1 || idx='{}'
          echo "::notice::index pred: $(echo "$idx" | head -c 200)"
          curl -s -X PUT -H "$H" "$kv/push:$id" --data "{\"sub\":{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/test-neexistuje\",\"keys\":{\"p256dh\":\"$P\",\"auth\":\"AAAAAAAAAAAAAAAAAAAAAA\"}},\"tz\":\"Europe/Bratislava\",\"doses\":[{\"k\":\"94163\",\"t\":\"$t\",\"d\":1,\"w\":\"\"}],\"notified\":{}}" >/dev/null
          curl -s -X PUT -H "$H" "$kv/doses:index" --data "$(echo "$idx" | jq -c --arg id $id --arg t $t '.[$id]={t:[$t],z:"Europe/Bratislava"}')" >/dev/null
          echo "::notice::vložené na $t"
          for i in $(seq 16); do sleep 30; c=$(curl -s -o /dev/null -w '%{http_code}' -H "$H" "$kv/push:$id"); [ "$c" = 404 ] && break; done
          echo "::notice::po $((i*30)) s: záznam $c (404 = Worker ho spracoval a zmazal), index: $(curl -s -H "$H" "$kv/doses:index" | head -c 200)"
          curl -s -X DELETE -H "$H" "$kv/push:$id" >/dev/null
          curl -s -H "$H" "$kv/doses:index" | jq -c --arg id $id 'del(.[$id])' | curl -s -X PUT -H "$H" "$kv/doses:index" --data @- >/dev/null
