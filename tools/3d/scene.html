<!doctype html>
<meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<body style="margin:0;background:transparent">
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 800, H = 600;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function mats(color, accent) {
  const c = new THREE.Color(color), a = new THREE.Color(accent);
  return {
    white: new THREE.MeshPhysicalMaterial({ color: 0xf7f8fa, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
    color: new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08 }),
    accent: new THREE.MeshPhysicalMaterial({ color: a, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1 }),
    foil: new THREE.MeshPhysicalMaterial({ color: 0xd9dde3, metalness: 0.9, roughness: 0.28 }),
    metal: new THREE.MeshPhysicalMaterial({ color: 0xc8ccd2, metalness: 1, roughness: 0.22 }),
    glass: new THREE.MeshPhysicalMaterial({ color: c.clone().lerp(new THREE.Color(0xffffff), 0.35), roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0.82 }),
    clear: new THREE.MeshPhysicalMaterial({ color: 0xeef6ff, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.38, depthWrite: false }),
    label: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.6 }),
    liquid: new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.15, clearcoat: 1 }),
    soft: new THREE.MeshPhysicalMaterial({ color: c.clone().lerp(new THREE.Color(0xffffff), 0.75), roughness: 0.55, sheen: 1, sheenColor: c }),
  };
}
const lathe = (pts, seg = 64) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);
function mesh(g, m) { const o = new THREE.Mesh(g, m); o.castShadow = true; o.receiveShadow = true; return o; }

function tabletShape(r = 0.42, h = 0.2) { // tableta so zaoblenými hranami
  const pts = [[0, -h / 2], [r * 0.85, -h / 2], [r, -h / 4], [r, h / 4], [r * 0.85, h / 2], [0, h / 2]];
  return lathe(pts.map(([x, y]) => [x, y]), 64);
}
const BUILD = {
  tablet(M) {
    const g = new THREE.Group();
    const foil = mesh(new RoundedBoxGeometry(3.2, 0.08, 2.2, 4, 0.12), M.foil); g.add(foil); g.rotation.x = 0.35;
    const back = mesh(new RoundedBoxGeometry(3.3, 0.06, 2.3, 4, 0.14), M.color); back.position.y = -0.06; g.add(back);
    for (let i = 0; i < 8; i++) {
      const x = -1.2 + (i % 4) * 0.8, z = -0.5 + Math.floor(i / 4) * 1.0;
      const dome = mesh(new THREE.SphereGeometry(0.36, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), M.clear); dome.scale.y = 0.7; dome.position.set(x, 0.04, z); g.add(dome);
      if (i !== 6) { const t = mesh(tabletShape(0.3, 0.14), M.accent); t.position.set(x, 0.12, z); g.add(t); }
    }
    g.rotation.set(0.75, -0.3, 0.05); g.position.set(-0.3, 0.9, -0.2);
    const loose = mesh(tabletShape(0.5, 0.24), M.accent); loose.position.set(1.55, 0.2, 1.05); loose.rotation.set(0.55, 0, -0.25);
    const score = mesh(new THREE.BoxGeometry(0.9, 0.03, 0.05), M.white); score.position.y = 0.125; loose.add(score);
    const root = new THREE.Group(); root.add(g, loose); return root;
  },
  capsule(M) {
    const root = new THREE.Group();
    function cap(x, z, ry, rz) {
      const c = new THREE.Group();
      const a = mesh(new THREE.CapsuleGeometry(0.36, 0.9, 16, 48), M.color); a.position.y = 0.42;
      const cl = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // polovica farebná, polovica biela
      const b = mesh(new THREE.CapsuleGeometry(0.355, 0.9, 16, 48), M.white); b.position.y = -0.42;
      a.scale.set(1.01, 0.62, 1.01); b.scale.set(1, 0.62, 1);
      c.add(a, b); c.rotation.set(0, ry, rz); c.position.set(x, 0.38, z); return c;
    }
    root.add(cap(-0.7, 0, 0.3, 1.35), cap(0.75, 0.55, -0.6, 1.62), cap(0.1, -0.85, 1.2, 1.5));
    return root;
  },
  bottle(M) {
    const root = new THREE.Group();
    const body = mesh(lathe([[0, 0], [0.82, 0], [0.9, 0.08], [0.9, 1.6], [0.78, 1.95], [0.42, 2.15], [0.4, 2.35], [0, 2.35]]), M.glass); root.add(body);
    const liq = mesh(lathe([[0, 0.05], [0.84, 0.05], [0.84, 1.25], [0, 1.25]]), M.liquid); root.add(liq);
    const lab = mesh(new THREE.CylinderGeometry(0.915, 0.915, 0.85, 64, 1, true, -1.2, 2.4), M.label); lab.position.y = 0.9; root.add(lab);
    const cap = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 48), M.color); cap.position.y = 2.55; root.add(cap);
    const cup = mesh(lathe([[0, 0], [0.42, 0], [0.55, 0.62], [0.52, 0.62], [0.4, 0.04], [0, 0.04]]), M.clear); cup.position.set(1.55, 0, 0.6); root.add(cup);
    root.position.set(-0.4, -1.1, 0); root.rotation.y = -0.4; return root;
  },
  inhaler(M) {
    const root = new THREE.Group();
    const can = mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.9, 48), M.metal); can.position.set(0, 1.55, 0); root.add(can);
    const boot = mesh(new RoundedBoxGeometry(1.15, 2.1, 1.05, 6, 0.32), M.color); boot.position.set(0, 0.6, 0); root.add(boot);
    const mouth = mesh(new RoundedBoxGeometry(1.05, 0.62, 1.3, 6, 0.24), M.color); mouth.position.set(0, -0.15, 0.75); root.add(mouth);
    const cap = mesh(new RoundedBoxGeometry(1.0, 0.5, 0.35, 6, 0.15), M.accent); cap.position.set(0, -0.15, 1.5); root.add(cap);
    root.position.y = -0.4; root.rotation.y = -0.7; return root;
  },
  pen(M) {
    const root = new THREE.Group();
    const body = mesh(new THREE.CylinderGeometry(0.32, 0.32, 3.2, 48), M.white); root.add(body);
    const win = mesh(new THREE.CylinderGeometry(0.325, 0.325, 0.9, 48), M.clear); win.position.y = 0.6; root.add(win);
    const ins = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.85, 32), M.liquid); ins.position.y = 0.6; root.add(ins);
    const knob = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.6, 48), M.color); knob.position.y = -1.85; root.add(knob);
    const cap = mesh(new THREE.CylinderGeometry(0.36, 0.36, 1.1, 48), M.color); cap.position.y = 2.1; root.add(cap);
    const clip = mesh(new RoundedBoxGeometry(0.12, 0.8, 0.12, 4, 0.05), M.metal); clip.position.set(0.38, 2.05, 0); root.add(clip);
    root.rotation.set(0.15, 0, 1.25); root.position.y = 0.4; return root;
  },
  vial(M) {
    const root = new THREE.Group();
    const v = new THREE.Group();
    v.add(mesh(lathe([[0, 0], [0.6, 0], [0.62, 0.05], [0.62, 1.6], [0.4, 1.85], [0.36, 2.05], [0, 2.05]]), M.clear));
    v.add(mesh(lathe([[0, 0.04], [0.57, 0.04], [0.57, 0.9], [0, 0.9]]), M.liquid));
    const cap = mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.38, 48), M.color); cap.position.y = 2.15; v.add(cap);
    const ring = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.16, 48), M.metal); ring.position.y = 1.92; v.add(ring);
    v.position.set(-0.9, -1, 0); root.add(v);
    const s = new THREE.Group();
    s.add(mesh(new THREE.CylinderGeometry(0.22, 0.22, 2.4, 40), M.clear));
    const pl = mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.2, 32), M.liquid); pl.position.y = -0.4; s.add(pl);
    const plunger = mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.0, 16), M.white); plunger.position.y = 1.6; s.add(plunger);
    const head = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.08, 32), M.color); head.position.y = 2.1; s.add(head);
    const needle = mesh(new THREE.CylinderGeometry(0.018, 0.018, 1.0, 8), M.metal); needle.position.y = -1.7; s.add(needle);
    s.rotation.z = -0.95; s.position.set(0.9, 0.2, 0.5); root.add(s);
    return root;
  },
  tube(M) {
    const root = new THREE.Group();
    const g = new THREE.CylinderGeometry(0.62, 0.62, 3, 64, 24, true);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) { const y = pos.getY(i), t = (y + 1.5) / 3; pos.setZ(i, pos.getZ(i) * (0.08 + 0.92 * Math.pow(t, 0.35))); pos.setX(i, pos.getX(i) * (1 + 0.25 * (1 - t))); }
    g.computeVertexNormals();
    const body = mesh(g, M.white); body.material = M.white.clone(); body.material.side = THREE.DoubleSide; root.add(body);
    const band = mesh(new THREE.CylinderGeometry(0.64, 0.64, 0.7, 64, 1, true), M.color); band.position.y = 0.6; band.material = M.color.clone(); band.material.side = THREE.DoubleSide; root.add(band);
    const sh = mesh(new THREE.CylinderGeometry(0.3, 0.62, 0.3, 48), M.white); sh.position.y = 1.65; root.add(sh);
    const cap = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.55, 32), M.color); cap.position.y = 2.05; root.add(cap);
    root.rotation.set(0, 0.3, -1.3); root.position.set(0, 0.55, 0); return root;
  },
};
BUILD.drops = function (M) { // sklenená fľaštička s pipetou
  const root = new THREE.Group();
  root.add(mesh(lathe([[0, 0], [0.62, 0], [0.66, 0.06], [0.66, 1.45], [0.36, 1.7], [0.3, 1.85], [0, 1.85]]), M.glass));
  root.add(mesh(lathe([[0, 0.05], [0.6, 0.05], [0.6, 0.8], [0, 0.8]]), M.liquid));
  const lab = mesh(new THREE.CylinderGeometry(0.67, 0.67, 0.6, 64, 1, true, -1.2, 2.4), M.label); lab.position.y = 0.75; root.add(lab);
  const cap = mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.36, 48), M.metal); cap.position.y = 2.0; root.add(cap);
  const bulb = mesh(lathe([[0, 0], [0.3, 0], [0.34, 0.3], [0.3, 0.6], [0.18, 0.75], [0, 0.78]]), M.color); bulb.position.y = 2.18; root.add(bulb);
  const drop = mesh(new THREE.SphereGeometry(0.16, 32, 16), M.liquid); drop.scale.y = 1.35; drop.position.set(1.0, 0.6, 0.4); root.add(drop);
  return root;
};
BUILD.eye = function (M) { // plastová očná kvapkadlová fľaštička
  const root = new THREE.Group();
  root.add(mesh(lathe([[0, 0], [0.5, 0], [0.56, 0.08], [0.56, 1.5], [0.42, 1.72], [0, 1.72]]), M.white));
  const lab = mesh(new THREE.CylinderGeometry(0.57, 0.57, 0.7, 64, 1, true, -1.2, 2.4), M.color); lab.position.y = 0.75; root.add(lab);
  const cap = mesh(lathe([[0, 0], [0.4, 0], [0.4, 0.5], [0.12, 1.15], [0, 1.2]]), M.color); cap.position.y = 1.72; root.add(cap);
  const drop = mesh(new THREE.SphereGeometry(0.15, 32, 16), M.liquid); drop.scale.y = 1.35; drop.position.set(0.9, 1.0, 0.4); root.add(drop);
  return root;
};
BUILD.nasal = function (M) { // nosový sprej
  const root = new THREE.Group();
  root.add(mesh(lathe([[0, 0], [0.6, 0], [0.64, 0.08], [0.64, 1.45], [0.45, 1.62], [0, 1.62]]), M.white));
  const lab = mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.75, 64, 1, true, -1.2, 2.4), M.color); lab.position.y = 0.75; root.add(lab);
  const coll = mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.18, 48), M.color); coll.position.y = 1.7; root.add(coll);
  const noz = mesh(lathe([[0, 0], [0.28, 0], [0.26, 0.5], [0.14, 1.05], [0.09, 1.15], [0, 1.15]]), M.white); noz.position.y = 1.78; root.add(noz);
  for (let i = 0; i < 9; i++) { const d = mesh(new THREE.SphereGeometry(0.035 + (i % 3) * 0.012, 12, 8), M.accent); d.position.set(0.25 + i * 0.09, 3.1 + Math.sin(i) * 0.12, Math.cos(i * 2) * 0.15); root.add(d); }
  return root;
};
BUILD.sachet = function (M) {
  const root = new THREE.Group();
  const s = mesh(new RoundedBoxGeometry(2.2, 0.16, 2.9, 6, 0.08), M.color); s.rotation.set(0.95, -0.35, 0.1); s.position.y = 1.0; root.add(s);
  for (const z of [-1.45, 1.45]) { const e = mesh(new RoundedBoxGeometry(2.2, 0.06, 0.18, 2, 0.02), M.accent); e.position.z = z; s.add(e); }
  const l = mesh(new RoundedBoxGeometry(1.4, 0.04, 1.0, 4, 0.04), M.label); l.position.y = 0.09; s.add(l);
  for (let i = 0; i < 18; i++) { const p = mesh(new THREE.SphereGeometry(0.05 + (i % 3) * 0.015, 12, 8), M.white); p.position.set(1.45 + Math.cos(i * 1.3) * 0.4, -0.05, 1.15 + Math.sin(i * 1.7) * 0.35); root.add(p); }
  return root;
};
BUILD.patch = function (M) {
  const root = new THREE.Group();
  const p = mesh(new RoundedBoxGeometry(2.4, 0.07, 2.4, 6, 0.035), M.soft); p.rotation.set(0.95, -0.4, 0.1); p.position.y = 1.0; root.add(p);
  const c = mesh(new RoundedBoxGeometry(1.5, 0.05, 1.5, 6, 0.025), M.color); c.position.y = 0.04; p.add(c);
  const q = mesh(new RoundedBoxGeometry(1.6, 0.05, 1.6, 6, 0.025), M.white); q.rotation.set(0.15, 0.6, 0.05); q.position.set(1.3, -0.3, 1.1); root.add(q);
  return root;
};
BUILD.supp = function (M) {
  const root = new THREE.Group();
  const pts = [[0, 0], [0.3, 0], [0.33, 0.04]]; for (let k = 0; k <= 16; k++) { const t = k / 16; pts.push([0.34 * Math.cos(t * Math.PI / 2) ** 0.6, 0.45 + 0.75 * Math.sin(t * Math.PI / 2)]); } const geo = lathe(pts);
  [[-0.5, 0.2, 0.25], [0.45, -0.25, -0.2], [0.1, 0.5, 0.9]].forEach(([x, r, z], i) => { const m = mesh(geo, i === 2 ? M.accent : M.white); m.rotation.set(0, r, 1.45 + r * 0.3); m.position.set(x + 0.55, 0.32, z); root.add(m); });
  const strip = mesh(new RoundedBoxGeometry(2.6, 0.05, 0.9, 4, 0.03), M.color); strip.position.set(0.3, -0.1, -0.9); strip.rotation.y = 0.2; root.add(strip);
  return root;
};
BUILD.other = function (M) { // škatuľka lieku s krížom
  const root = new THREE.Group();
  const box = mesh(new RoundedBoxGeometry(2.4, 1.5, 1.1, 6, 0.12), M.white); box.rotation.y = -0.5; box.position.y = 0.4; root.add(box);
  const band = mesh(new RoundedBoxGeometry(2.42, 0.5, 1.12, 6, 0.1), M.color); band.position.y = -0.3; box.add(band);
  const v = mesh(new RoundedBoxGeometry(0.18, 0.6, 0.06, 2, 0.03), M.color); v.position.set(-0.6, 0.25, 0.56); box.add(v);
  const h = mesh(new RoundedBoxGeometry(0.6, 0.18, 0.06, 2, 0.03), M.color); h.position.set(-0.6, 0.25, 0.56); box.add(h);
  return root;
};

const scene = new THREE.Scene(); scene.environment = envTex; scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
camera.position.set(0, 4.2, 7.6); camera.lookAt(0, 0.2, 0);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 8, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 24;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
scene.add(key, new THREE.AmbientLight(0xffffff, 0.25));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.25; ground.receiveShadow = true; scene.add(ground);

window.render3d = (form, color, accent) => {
  const old = scene.getObjectByName('obj'); if (old) scene.remove(old);
  const o = (BUILD[form] || BUILD.other)(mats(color, accent)); o.name = 'obj';
  // umiestniť na zem a vycentrovať
  const box = new THREE.Box3().setFromObject(o); const size = box.getSize(new THREE.Vector3());
  const s = 4.4 / Math.max(size.x, size.y * 1.4, size.z * 0.9);
  o.scale.setScalar(s);
  const b2 = new THREE.Box3().setFromObject(o); const c2 = b2.getCenter(new THREE.Vector3());
  o.position.x -= c2.x; o.position.z -= c2.z; o.position.y += -1.25 - b2.min.y;
  scene.add(o);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
